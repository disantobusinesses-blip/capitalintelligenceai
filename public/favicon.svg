<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- White background -->
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- "i" dot — dark chocolate brown -->
  <circle cx="88" cy="72" r="28" fill="#3B1F0D"/>
  <!-- "i" stem — dark chocolate brown -->
  <rect x="63" y="112" width="50" height="220" fill="#3B1F0D"/>
  <!-- "A" — medium warm brown (overlaps i stem) -->
  <text x="82" y="340"
        font-family="'Arial Black','Impact','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="270"
        font-weight="900"
        fill="#6B3920">A</text>
  <!-- "S" — copper brown (overlaps A) -->
  <text x="202" y="346"
        font-family="'Arial Black','Impact','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="276"
        font-weight="900"
        fill="#9E5E30">S</text>
</svg>
